[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpl-optimizer"
version = "0.1.0"
description = "Human-in-the-loop FPL decision-support system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pulp>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
fpl-optimizer = "fpl_optimizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
