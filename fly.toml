# fly.toml app configuration file generated for fpl-optimizer-api on 2026-08-24T11:12:08-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fpl-optimizer-api'
primary_region = 'iad'

[build]
[env]
  DB_PATH = '/app/data/db/fpl.sqlite'

[[mounts]]
  source = 'fpl_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  # This app has one job scale-to-zero would silently break: the daily 6am refresh
  # (api/scheduler.py) — the whole point of moving it off WSL cron. Keep one machine
  # always on rather than the usual stateless-API auto-stop default.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
