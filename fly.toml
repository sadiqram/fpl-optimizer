# Fly.io app config for the FastAPI backend (M8). Deploy with:
#   fly launch --no-deploy   (first time only — creates the app; it may offer to overwrite
#                             this file with a generated one, decline and keep this version)
#   fly volumes create fpl_data --size 1 --region <region>
#   fly secrets set JWT_SECRET=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
#   fly secrets set FPL_TEAM_ID=<your team id> CORS_ORIGIN=https://<your-vercel-domain>
#   fly deploy
#
# app name below is a placeholder — `fly launch` will prompt to rename it (must be
# globally unique on Fly.io). Verify this file's syntax against `fly config validate`
# before deploying — it was hand-written, not generated by `fly launch`.
app = "fpl-optimizer-api"
primary_region = "iad"

[build]

[env]
  DB_PATH = "/app/data/db/fpl.sqlite"

[[mounts]]
  source = "fpl_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  # This app has one job scale-to-zero would silently break: the daily 6am refresh
  # (api/scheduler.py) — the whole point of moving it off WSL cron. Keep one machine
  # always on rather than the usual stateless-API auto-stop default.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
